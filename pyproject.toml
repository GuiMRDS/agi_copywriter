[project]
name = "agi-copywriter"
version = "0.1.0"
description = "Agente de IA que escreve roteiros de Reels no estilo de criadores de conteúdo"
readme = "README.md"
authors = [
    { name = "Guilherme", email = "guimars22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=3",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.4",
    "groq>=1.7.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
agi-copywriter = "agi_copywriter:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
